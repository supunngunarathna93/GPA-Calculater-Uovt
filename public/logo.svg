<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2212" />
      <stop offset="50%" stop-color="#141318" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#99701a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4a843" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circular Shield Background -->
  <circle cx="32" cy="32" r="30" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)" />
  <circle cx="32" cy="32" r="26.5" stroke="rgba(212, 168, 67, 0.4)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Vocational Technology Gear Accents (8 notches) -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="3" x2="32" y2="6" />
    <line x1="32" y1="58" x2="32" y2="61" />
    <line x1="3" y1="32" x2="6" y2="32" />
    <line x1="58" y1="32" x2="61" y2="32" />
    <line x1="11.5" y1="11.5" x2="13.6" y2="13.6" />
    <line x1="50.4" y1="50.4" x2="52.5" y2="52.5" />
    <line x1="11.5" y1="52.5" x2="13.6" y2="50.4" />
    <line x1="50.4" y1="13.6" x2="52.5" y2="11.5" />
  </g>

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g fill="url(#goldGrad)">
    <!-- Cap top diamond -->
    <polygon points="32,15 48,22.5 32,30 16,22.5" />
    <!-- Cap skull cap -->
    <path d="M22,25.5 L22,33 C22,37 42,37 42,33 L42,25.5 L32,30.2 Z" opacity="0.9" />
    <!-- Cap tassel -->
    <path d="M44,24.5 L46,34 L44.5,35 L43,34 Z" />
  </g>

  <!-- Open Academic Book -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left page -->
    <path d="M32,44 C26,40.5 19,41.5 16,43 L16,51 C19,49.5 26,48.5 32,52 Z" fill="rgba(212, 168, 67, 0.12)" />
    <!-- Right page -->
    <path d="M32,44 C38,40.5 45,41.5 48,43 L48,51 C45,49.5 38,48.5 32,52 Z" fill="rgba(212, 168, 67, 0.12)" />
    <!-- Center spine -->
    <line x1="32" y1="44" x2="32" y2="52" stroke-width="2" />
  </g>

  <!-- Monogram text UOVT in small clean font -->
  <text x="32" y="39.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#ffffff" letter-spacing="0.16em">UOVT</text>
</svg>
